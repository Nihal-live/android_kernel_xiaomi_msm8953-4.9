name: Kernel Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fix SSL and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make libssl-dev bc python3
          sudo apt-get install --reinstall ca-certificates
          sudo update-ca-certificates --fresh

      - name: Patch WireGuard Requirement
        run: |
          sed -i '/source "net\/wireguard\/Kconfig"/d' net/Kconfig || true
          echo "CONFIG_WIREGUARD=n" >> arch/arm64/configs/mido_defconfig

      - name: Build Kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make mido_defconfig
          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz-dtb
