name: Kernel Build and Package

on:
  push:
    branches:
      - main  # Trigger build on push to the main branch
  pull_request:
    branches:
      - main  # Trigger build on PR targeting the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub Actions will run on Ubuntu-based VM

    steps:
      # Step 1: Checkout repository
      - name: Checkout kernel repository
        uses: actions/checkout@v2

      # Step 2: Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            gcc-4.9 \
            g++-4.9 \
            git \
            wget \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            unzip \
            zlib1g-dev

      # Step 3: Install the Android NDK
      - name: Install Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip android-ndk-r21e-linux-x86_64.zip
          sudo mv android-ndk-r21e /opt/

      # Step 4: Set up cross-compilation environment
      - name: Set up environment variables for cross-compilation
        run: |
          echo "export CROSS_COMPILE=/opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "export ARCH=arm64" >> $GITHUB_ENV
          echo "export PATH=\$PATH:/opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/" >> $GITHUB_ENV

      # Step 5: Apply NetHunter patches (if any)
      - name: Apply NetHunter patches
        run: |
          git clone https://github.com/offensive-security/kali-nethunter.git
          cd kali-nethunter
          # Apply patches
          patch -p1 < ../path_to_your_nethunter_patch_file.patch

      # Step 6: Configure the kernel for your device
      - name: Configure the kernel
        run: |
          cd $GITHUB_WORKSPACE
          make msm8953_defconfig  # Change this to your device's config

      # Step 7: Build the kernel
      - name: Build the kernel
        run: |
          cd $GITHUB_WORKSPACE
          make -j$(nproc)

      # Step 8: Package kernel with AnyKernel3
      - name: Package the kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $GITHUB_WORKSPACE/arch/arm64/boot/Image AnyKernel3/
          cp $GITHUB_WORKSPACE/arch/arm64/boot/dtbo.img AnyKernel3/  # Only if applicable
          cd AnyKernel3
          ./anykernel.sh

      # Step 9: Upload the kernel package as an artifact
      - name: Upload kernel package
        uses: actions/upload-artifact@v2
        with:
          name: kernel-package
          path: AnyKernel3/*.zip
 
